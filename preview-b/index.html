<!doctype html>
<html lang="ja">
<head>
  <base href="../">
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f7efe0">
  <meta name="description" content="20の選択で、あなたの選び方を童話の登場人物にたとえる診断。16人の物語から、今日のあなたに似た一人を見つけよう。">
  <title>童話キャラ16タイプ診断</title>
  <style>
    /* V8: translucent paper, a poster-sized portrait, and two existing font stacks. */
    :root {
      color-scheme: light;
      --paper: #f7efe0;
      --sheet: #fffaf0;
      --ink: #493725;
      --gold: #b08d3f;
      --float-shadow: 0 12px 32px rgba(73,55,37,.12);
      --mincho: "Hiragino Mincho ProN", "Hiragino Mincho Pro", "YuMincho", "Yu Mincho", "MS PMincho", serif;
      font-family: "Hiragino Maru Gothic ProN", "Yu Gothic", Meiryo, sans-serif;
      font-synthesis: none;
    }
    * { box-sizing: border-box; }
    [hidden] { display: none !important; }
    body { margin: 0; background: var(--paper); color: var(--ink); font-size: 17px; line-height: 1.9; overflow-wrap: anywhere; }
    button, textarea { font: inherit; }
    button, a, summary { -webkit-tap-highlight-color: transparent; touch-action: manipulation; }
    button, summary { cursor: pointer; color: inherit; }
    a { color: inherit; text-underline-offset: 5px; }
    button:focus-visible, a:focus-visible, textarea:focus-visible, summary:focus-visible { outline: 3px solid var(--ink); outline-offset: 4px; }
    h1:focus, h2:focus { outline: none; }
    h1, h2, h3, p { margin: 0; }
    h1, h2, h3 { font-family: var(--mincho); font-weight: 700; line-height: 1.6; letter-spacing: .035em; }
    h1 { font-size: clamp(30px, 7.5vw, 42px); }
    h2 { font-size: 24px; }
    h3 { font-size: 20px; }
    .shell { position: relative; z-index: 1; width: min(100% - 28px, 640px); margin: 0 auto; }
    .masthead { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; min-height: 76px; border-bottom: 3px double var(--gold); gap: 4px 12px; padding-block: 12px; }
    .brand { text-decoration: none; font-family: var(--mincho); font-size: 15px; letter-spacing: .05em; font-weight: 700; display: flex; align-items: center; gap: 8px; min-height: 44px; }
    .brand-mark { font-size: 22px; color: var(--gold); }
    .masthead-label { font-size: 14px; }
    main { padding: 32px 0 8px; min-height: 68vh; }
    .eyebrow { font-size: 14px; letter-spacing: .06em; font-weight: 700; }
    .center { text-align: center; }
    .muted { color: var(--ink); }
    .small { font-size: 15px; }
    /* Only the outer cover and result retain the gold double frame. */
    .cover, .result-card { position: relative; border: 1px solid var(--gold); border-radius: 3px; background: var(--sheet); box-shadow: var(--float-shadow); }
    .cover::after, .result-card::after { content: ""; position: absolute; inset: 6px; border: 1px solid var(--gold); border-radius: 3px; pointer-events: none; }
    .frame-corners { position: absolute; inset: 0; pointer-events: none; color: var(--gold); z-index: 2; }
    .frame-corners i { position: absolute; width: 16px; height: 16px; font: normal 14px/16px var(--mincho); text-align: center; background: var(--sheet); }
    .frame-corners i::before { content: "✦"; }
    .frame-corners i:nth-child(1) { top: 0; left: 0; }
    .frame-corners i:nth-child(2) { top: 0; right: 0; }
    .frame-corners i:nth-child(3) { bottom: 0; left: 0; }
    .frame-corners i:nth-child(4) { bottom: 0; right: 0; }
    .cover { padding: 32px 24px; }
    .book-label { font-family: var(--mincho); font-size: 15px; letter-spacing: .2em; margin-bottom: 16px; }
    .cover h1 { margin: 20px 0; }
    .title-number { font-size: 1.4em; vertical-align: -.04em; padding-right: .04em; }
    .art-aura { position: relative; margin: 28px auto; }
    .cover-art { display: block; width: 100%; height: auto; aspect-ratio: 3 / 2; object-fit: contain; border-radius: 3px; }
    .cover-intro { font-size: 17px; line-height: 1.9; }
    .cover-meta { display: flex; flex-wrap: wrap; justify-content: center; gap: 8px 20px; margin: 28px 0 24px; font-size: 14px; }
    .button { position: relative; overflow: hidden; display: flex; justify-content: center; align-items: center; gap: 12px; min-height: 60px; width: 100%; border: 0; border-radius: 3px; padding: 17px 20px; text-decoration: none; font-size: 17px; font-weight: 700; background: var(--paper); line-height: 1.65; text-align: center; box-shadow: var(--float-shadow); transition: transform .18s ease; }
    .button.primary { background: var(--ink); color: var(--sheet); font-family: var(--mincho); letter-spacing: .05em; }
    .button:active { transform: translateY(2px); }
    .button .arrow { margin-left: auto; }
    .cover .button { z-index: 1; }
    .text-link { display: inline-flex; align-items: center; justify-content: center; min-width: 44px; min-height: 48px; padding-block: 8px; font-size: 16px; }
    .under-cover { padding-top: 24px; }
    .how-it-works { margin-top: 40px; padding: 24px 8px 0; }
    .how-it-works h2 { font-size: 22px; margin-bottom: 20px; }
    .how-it-works p { font-size: 16px; }
    .page-meta { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: baseline; gap: 8px; margin-bottom: 20px; font-size: 14px; }
    .page-meta p { font-family: var(--mincho); font-weight: 700; }
    .page-meta strong { font-size: 26px; margin: 0 4px; }
    progress { display: block; width: 100%; height: 12px; appearance: none; border: 0; background: var(--paper); overflow: hidden; }
    progress::-webkit-progress-bar { background: var(--paper); }
    progress::-webkit-progress-value, progress::-moz-progress-bar { background: var(--gold); }
    .progress-ribbon { position: relative; height: 12px; background: rgba(176,141,63,.16); border-radius: 3px; overflow: hidden; }
    .progress-ribbon progress { position: absolute; inset: 0; opacity: 0; }
    .ribbon-fill { position: absolute; inset: 0; transform-origin: left center; transform: scaleX(var(--progress)); background: var(--gold); clip-path: polygon(0 0, 100% 0, 98% 50%, 100% 100%, 0 100%); pointer-events: none; }
    .question-paper { margin: 40px 0 24px; padding: 28px 24px; background: var(--sheet); border-radius: 3px; box-shadow: var(--float-shadow); }
    .question-emoji { font-size: 38px; display: block; margin-bottom: 18px; }
    .question-paper h1 { font-size: clamp(22px, 5.7vw, 28px); line-height: 1.85; }
    .question-prompt { margin-top: 24px; font-size: 15px; }
    .choices { display: grid; gap: 16px; counter-reset: choice; }
    .choice { position: relative; counter-increment: choice; display: flex; gap: 16px; align-items: center; width: 100%; min-height: 88px; padding: 20px; text-align: left; background: var(--sheet); border: 0; border-radius: 3px; font-size: 17px; line-height: 1.9; box-shadow: var(--float-shadow); transform-origin: left center; transition: transform .2s ease, opacity .2s ease; }
    .choice-letter { flex: 0 0 32px; height: 36px; display: grid; place-items: center; font-size: 0; }
    .choice-letter::after { content: counter(choice, upper-roman); font: 700 17px/1 var(--mincho); }
    .choice:hover, .choice.selected { background: var(--paper); }
    .choice:active { transform: perspective(700px) rotateY(-2deg) translateX(2px); }
    .choice:disabled { cursor: default; opacity: .58; }
    .choice.selected:disabled { opacity: 1; animation: select-page .2s ease-out; }
    .back-button { border: 0; background: transparent; padding: 16px 6px; min-height: 48px; min-width: 44px; margin-top: 20px; text-decoration: underline; text-underline-offset: 5px; font-size: 16px; }
    .list-intro { margin: 20px 0 40px; font-size: 17px; }
    .family-group + .family-group { margin-top: 56px; }
    .family-heading { font-size: 26px; text-decoration: underline; text-decoration-color: var(--accent); text-decoration-thickness: 3px; text-underline-offset: 10px; }
    .family-intro { margin: 24px 0 28px; font-size: 17px; }
    .type-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 20px; }
    .type-tile { display: flex; flex-direction: column; min-width: 0; padding: 16px; background: var(--sheet); border: 0; border-radius: 3px; box-shadow: var(--float-shadow); text-decoration: none; transition: transform .2s ease; }
    .type-tile > .frame-corners { display: none; }
    .tile-top { order: 3; display: flex; justify-content: space-between; align-items: center; gap: 4px; margin-top: 16px; }
    .tile-emoji { font-size: 22px; }
    .illustration { display: block; height: auto; aspect-ratio: 1; object-fit: contain; border: 0; border-radius: 3px; }
    .illustration-caption { font-family: var(--mincho); font-weight: 700; line-height: 1.65; text-align: center; }
    .tile-image { width: 100%; order: 0; }
    .code { font-family: inherit; letter-spacing: .1em; font-size: 14px; }
    .type-tile h3 { order: 1; font-size: 20px; margin: 16px 0 12px; text-decoration: underline; text-decoration-color: var(--accent); text-decoration-thickness: 2px; text-underline-offset: 6px; }
    .type-tile p { order: 2; font-size: 16px; }
    .tile-arrow { order: 4; margin-top: auto; padding-top: 16px; text-align: right; font-size: 20px; }
    .result-heading { margin-bottom: 24px; text-align: center; font-size: 15px; }
    .result-card { padding: 12px 0 40px; }
    .result-band { height: 1px; margin: 0 14px; background: var(--gold); }
    .result-kicker { font-size: 15px; color: var(--muted); letter-spacing: .1em; margin: 0 0 14px; }
    .result-hero { position: relative; isolation: isolate; overflow: hidden; padding: 12px 12px 32px; text-align: center; }
    .result-hero::before { content: ""; position: absolute; z-index: -1; inset: -12% -8%; pointer-events: none; background: radial-gradient(ellipse at 20% 30%, var(--hero-glow), transparent 56%), radial-gradient(ellipse at 82% 68%, var(--hero-glow), transparent 54%), radial-gradient(ellipse at 55% 45%, rgba(176,141,63,.12), transparent 62%); animation: hero-light 10s ease-in-out infinite; }
    .portrait-frame { position: relative; width: 100%; }
    .result-image { width: 100%; }
    /* The only glass surface in the site. Keep every name and catch in full. */
    .result-hero h1 { position: relative; margin: -20px 8px 0; padding: 20px 12px; border-radius: 3px; background: rgba(255,250,240,.72); -webkit-backdrop-filter: blur(12px); backdrop-filter: blur(12px); box-shadow: var(--float-shadow); font-size: clamp(34px, 9vw, 48px); line-height: 1.45; letter-spacing: .025em; text-wrap: balance; }
    .catch { margin: 28px 12px 0; font-family: var(--mincho); font-size: clamp(20px, 5.2vw, 25px); line-height: 1.8; font-weight: 700; text-align: left; }
    .section { position: relative; margin: 40px 16px 0; padding: 28px 20px; border: 0; border-radius: 3px; background: var(--paper); }
    .section h2 { position: relative; font-size: 23px; margin-bottom: 24px; padding-top: 16px; }
    .section h2::before { content: ""; position: absolute; top: 0; left: 0; width: 36px; height: 3px; background: var(--accent); }
    .persona, .love-text, .family-description, .trait-list li, .pair-line, .pair-love { font-size: 17px; line-height: 1.9; }
    .result-family { margin: 40px 0 16px; font-size: 22px; text-decoration: underline; text-decoration-color: var(--accent); text-underline-offset: 8px; text-decoration-thickness: 2px; }
    .result-motif { margin-top: 24px; font-size: 15px; }
    .result-motif .code { margin-left: 12px; }
    .love-pitfalls { margin: 40px 0 20px; font-size: 21px; }
    .section-note, .axis-note, .source-note { font-size: 15px; line-height: 1.9; }
    .section-note { margin-top: 16px; }
    .axis { margin-top: 32px; }
    .axis-top { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 8px; margin-bottom: 18px; font-size: 16px; font-weight: 700; }
    .close-badge { padding: 4px 8px; background: var(--sheet); border-radius: 3px; font-size: 14px; }
    .axis-labels { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; font-size: 16px; }
    .axis-labels > span:last-child { text-align: right; }
    .axis-description { display: block; margin-top: 12px; font-size: 16px; line-height: 1.9; }
    .axis-labels strong { display: block; margin: 12px 0 8px; font-size: 22px; }
    .axis-track { height: 12px; background: rgba(73,55,37,.12); border-radius: 3px; overflow: hidden; }
    .axis-fill { display: block; height: 100%; background: var(--ink); }
    .axis-note { margin-top: 16px; }
    details.notes { margin-top: 24px; }
    details summary { min-height: 48px; padding: 12px 0; font-size: 16px; font-weight: 700; }
    details[open] > summary { margin-bottom: 16px; }
    .trait-list { list-style: none; padding: 0; margin: 0; }
    .trait-list li { position: relative; padding-left: 24px; margin-top: 24px; }
    .trait-list li:first-child { margin-top: 0; }
    .trait-list li::before { content: "✦"; position: absolute; left: 0; color: var(--gold); font-size: 16px; }
    .stumbles li::before { content: "○"; }
    .evidence { margin: 24px 0; }
    .evidence-row { display: grid; grid-template-columns: 24px 1fr; gap: 12px; margin-top: 24px; }
    .evidence dt { font-family: var(--mincho); font-weight: 700; }
    .evidence dd { margin: 0; font-size: 16px; }
    .evidence dd strong { display: block; font-size: 15px; margin-bottom: 8px; }
    .source-note { margin-top: 24px; }
    .companion-scene { display: grid; grid-template-columns: minmax(0, 1fr) 16px minmax(0, 1fr); align-items: start; gap: 8px; margin: 28px 0; }
    .companion-self, .companion { min-width: 0; }
    .companion-self .illustration, .companion-image { width: 100%; }
    .companion-self .illustration-caption, .companion h3 { display: block; font-size: 17px; margin-top: 16px; }
    .companion > div { display: flex; flex-direction: column; align-items: center; text-align: center; }
    .companion h3 { order: -1; }
    .companion .code { margin-top: 12px; }
    .companion-family { margin-top: 12px; font-size: 14px; }
    .pair-star { justify-self: center; align-self: center; color: var(--gold); }
    .pair-line { margin-bottom: 24px; }
    .pair-love { margin-bottom: 24px; }
    .pair-love strong { display: block; margin-bottom: 12px; }
    .companion-notes { margin-bottom: 24px; }
    .nearby-links { display: grid; gap: 20px; }
    .nearby-link { display: block; min-height: 56px; padding: 20px; border: 0; border-radius: 3px; text-decoration: none; font-size: 17px; background: var(--sheet); box-shadow: var(--float-shadow); }
    .nearby-link small { display: block; font-size: 14px; margin-bottom: 8px; }
    .actions { display: grid; gap: 16px; margin-top: 40px; }
    .status { font-size: 15px; text-align: center; }
    .status:empty { display: none; }
    .copy-fallback { margin-top: 16px; }
    .copy-fallback label { font-size: 16px; }
    textarea { width: 100%; min-height: 120px; padding: 16px; border: 1px solid var(--ink); border-radius: 3px; background: var(--sheet); color: var(--ink); resize: vertical; }
    .type-back { margin-top: 40px; }
    footer { margin-top: 48px; padding: 32px 0; border-top: 3px double var(--gold); text-align: center; font-size: 14px; }
    footer p + p { margin-top: 12px; }
    .footer-mark { margin-bottom: 20px; font-size: 20px; color: var(--gold); }
    .story-continues { display: flex; align-items: center; justify-content: center; gap: 12px; margin-top: 28px; font-family: var(--mincho); font-size: 16px; }
    .moon-ornament { display: inline-block; width: 10px; height: 10px; border-radius: 50%; background: var(--gold); clip-path: polygon(0 0, 60% 0, 35% 40%, 60% 100%, 0 100%); vertical-align: middle; margin-right: 8px; }
    .chapter-star { display: inline-block; color: var(--gold); margin-left: 8px; vertical-align: middle; }
    /* Retain stardust and selection page-turns; only the hero light loops. */
    .star { display: block; width: 8px; height: 8px; background: currentColor; clip-path: polygon(50% 0, 62% 37%, 100% 50%, 62% 63%, 50% 100%, 38% 63%, 0 50%, 38% 37%); }
    .stardust { position: fixed; inset: 0; overflow: hidden; pointer-events: none; color: var(--gold); }
    .stardust .star { position: absolute; left: var(--x); top: var(--y); width: var(--size, 8px); height: var(--size, 8px); opacity: .2; }
    .portrait-stars { position: absolute; inset: 0; pointer-events: none; color: var(--gold); }
    .portrait-stars .star { position: absolute; left: 12px; top: 24%; opacity: .3; }
    .portrait-stars .star:nth-child(2) { left: auto; right: 12px; top: 68%; }
    .reveal-dust { position: absolute; inset: 0; z-index: 3; overflow: hidden; pointer-events: none; color: var(--gold); }
    .reveal-dust .star { position: absolute; left: var(--x); top: var(--y); opacity: 0; animation: falling-star .6s ease-out .45s both; }
    .choice-sparks { position: absolute; right: 28px; top: 50%; pointer-events: none; color: var(--gold); }
    .choice-sparks .star { position: absolute; opacity: 0; width: 7px; height: 7px; }
    .choice-sparks .star:nth-child(1) { --dx: -25px; --dy: -23px; }
    .choice-sparks .star:nth-child(2) { --dx: 18px; --dy: -29px; }
    .choice-sparks .star:nth-child(3) { --dx: 25px; --dy: 18px; }
    .choice-sparks .star:nth-child(4) { --dx: -17px; --dy: 24px; }
    .choice.selected:disabled .choice-sparks .star { animation: choice-spark .5s ease-out both; }
    .screen-enter { animation: fade-up .45s ease-out both; }
    .result-card > .section { animation: fade-up .45s ease-out both; animation-delay: calc(var(--chapter, 0) * 80ms); }
    .reveal-complete.screen-enter, .reveal-complete .result-card > .section { animation: none; }
    .reveal-complete .reveal-dust .star { animation: none; opacity: 0; }
    @keyframes fade-up { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: translateY(0); } }
    @keyframes hero-light { 0%, 100% { transform: translate3d(-1%, 0, 0); } 50% { transform: translate3d(1%, 1%, 0); } }
    @keyframes select-page { 0% { opacity: .65; transform: perspective(700px) rotateY(-3deg) translateX(3px); } 100% { opacity: 1; transform: perspective(700px) rotateY(0) translateX(0); } }
    @keyframes choice-spark { 0% { opacity: 0; transform: translate(0, 0) scale(.4); } 18% { opacity: .85; } 100% { opacity: 0; transform: translate(var(--dx), var(--dy)) scale(.6) rotate(35deg); } }
    @keyframes falling-star { 0% { opacity: 0; transform: translate(-7px, -14px) rotate(-15deg); } 20% { opacity: .65; } 100% { opacity: 0; transform: translate(10px, 52px) rotate(30deg); } }
    /* V9: diagrams share the paper surface and existing type / gold accents. */
    .axis-labels { gap: 16px; align-items: start; }
    .axis-pole { display: block; font-size: 16px; font-weight: 700; }
    .axis-symbol { display: inline-block; margin-right: 6px; color: var(--ink); }
    .axis-labels strong { margin-top: 8px; }
    .axis-track { position: relative; height: 28px; margin: 16px 0 0; overflow: visible; background: var(--sheet); border: 1px solid rgba(73,55,37,.35); }
    .axis-fill { border-radius: 2px; background: linear-gradient(90deg, var(--accent), var(--gold)); }
    .gauge-ticks { position: absolute; inset: 0; width: 100%; height: 100%; color: var(--ink); }
    .range-band { position: absolute; top: -7px; bottom: -7px; left: 33.333333%; width: 33.333334%; border: 2px dashed var(--ink); border-radius: 3px; background: rgba(255,250,240,.45); }
    .gauge-needle { position: absolute; top: -7px; bottom: -7px; left: clamp(2px, var(--value), calc(100% - 2px)); width: 3px; transform: translateX(-50%); background: var(--ink); }
    .gauge-needle::before { content: ''; position: absolute; top: -5px; left: -4px; width: 11px; height: 7px; background: var(--ink); clip-path: polygon(0 0, 100% 0, 50% 100%); }
    .gauge-scale { display: flex; justify-content: space-between; margin-top: 10px; font-size: 14px; }
    .gauge-caption { margin-top: 8px; font-size: 14px; }
    .range-key { display: inline-block; width: 24px; height: 12px; margin-right: 6px; vertical-align: middle; border: 2px dashed var(--ink); background: rgba(255,250,240,.45); }
    .axis-descriptions { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px; margin-top: 12px; }
    .axis-description { margin-top: 0; }
    .axis-descriptions > p:last-child { text-align: right; }
    .radar-chart { margin: 0 0 36px; padding: 20px 12px; background: var(--sheet); border-radius: 3px; }
    .diagram-title { font-family: var(--mincho); font-size: 20px; font-weight: 700; }
    .radar-plot { position: relative; max-width: 360px; margin: 20px auto; padding: 38px; }
    .radar-svg { display: block; width: 100%; height: auto; overflow: visible; }
    .radar-grid { fill: none; stroke: var(--gold); stroke-width: 1; }
    .radar-spokes { fill: none; stroke: var(--ink); stroke-opacity: .3; }
    .radar-area { fill: var(--accent); fill-opacity: .22; stroke: var(--accent); stroke-width: 3; stroke-linejoin: round; }
    .radar-point { fill: var(--ink); stroke: var(--sheet); stroke-width: 1.5; }
    .radar-pole { position: absolute; font-size: 14px; line-height: 1.5; text-align: center; }
    .radar-pole strong { display: block; font-size: 16px; }
    .radar-pole:nth-of-type(1) { top: 0; left: 50%; transform: translateX(-50%); }
    .radar-pole:nth-of-type(2) { top: 50%; right: 0; transform: translateY(-50%); }
    .radar-pole:nth-of-type(3) { bottom: 0; left: 50%; transform: translateX(-50%); }
    .radar-pole:nth-of-type(4) { top: 50%; left: 0; transform: translateY(-50%); }
    .radar-legend { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px 16px; padding: 0; margin: 0; list-style: none; font-size: 14px; }
    .radar-legend strong { display: block; font-size: 16px; }
    .diagram-note { margin-top: 16px; font-size: 14px; }
    .family-map { margin: 24px 0 32px; }
    .family-map > figcaption { margin-bottom: 16px; }
    .family-map-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px; }
    .family-map-group { min-width: 0; padding: 12px 10px; border-radius: 3px; background: var(--sheet); }
    .family-map-group h3, .family-map-group h4 { margin: 0 0 16px; padding-top: 10px; border-top: 3px solid var(--family-accent); font-family: var(--mincho); font-size: 18px; line-height: 1.6; }

    function shuffled(items, random = Math.random) {
      const copy = [...items];
      for (let i = copy.length - 1; i > 0; i--) {
        const j = Math.floor(random() * (i + 1));
        [copy[i], copy[j]] = [copy[j], copy[i]];
      }
      return copy;
    }
    function buildQuiz(random = Math.random) {
      const groups = AXES.map((axis, index) =>

          ...question, options: shuffled(question.options, random)
        }))
      );
      // 各問の4択を開始時にシャッフル。同じ軸の連続を避け、4軸を5巡する。
      return Array.from({ length: 5 }, (_, i) => groups.map(group => group[i])).flat();
    }
    function calculateResult(items, picks) {
      if (!Array.isArray(items) || !Array.isArray(picks) || items.length !== 20 || picks.length !== 20) throw new Error('20問の回答が必要です。');
      const scores = AXES.map(() => [0, 0]);
      const counts = AXES.map(() => [0, 0]);
      for (let index = 0; index < items.length; index++) {
        const question = items[index];
        if (!question || !Number.isInteger(question.axis) || !AXES[question.axis]) throw new Error('質問の軸が不正です。');
        const pick = picks[index];
        if (!Array.isArray(question.options) || !Number.isInteger(pick) || pick < 0 || pick >= question.options.length) throw new Error('選択肢インデックスが範囲外です。');
        const option = question.options[pick];
        if (!option || (option.w !== 1 && option.w !== 2)) throw new Error('選択肢の重み w は1または2が必要です。');
        const poleIndex = AXES[question.axis].poles.indexOf(option.pole);
        if (poleIndex < 0) throw new Error('回答の極が質問の軸と一致しません。');
        scores[question.axis][poleIndex] += option.w;
        counts[question.axis][poleIndex]++;
      }
      const tieAxes = [];
      const code = scores.map((score, index) => {
        if (score[0] !== score[1]) return AXES[index].poles[score[0] > score[1] ? 0 : 1];
        tieAxes.push(index);
        const count = counts[index];
        if (count[0] === count[1]) throw new Error('点数と回答数がともに同点です。各軸5問を確認してください。');
        return AXES[index].poles[count[0] > count[1] ? 0 : 1];
      }).join('');
      const closeAxes = scores.flatMap((score, index) => Math.min(...score) * 3 >= score[0] + score[1] ? [index] : []);
      return { code, scores, counts, closeAxes, tieAxes };
    }
    function flipAxis(code, index) {
      const letters = [...code];

      return letters.join('');

      return AXES.map((axis, index) => {
        const scores = personal ? result.scores[index] : (code[index] === axis.poles[0] ? [10, 0] : [0, 10]);
        const percent = Math.round(100 * scores[0] / (scores[0] + scores[1]));
        const close = personal && result.closeAxes.includes(index);
        const tie = personal && result.tieAxes.includes(index);
        const winner = axis.poles.indexOf(code[index]);
        const note = close ? (tie ? AXIS_NOTES.tie(...axis.labels) : AXIS_NOTES.close(axis.labels[winner], axis.labels[1 - winner])) : '';
        return `<div class="axis"><div class="axis-top"><span>${index + 1}. ${axis.name}</span>${close ? `<span class="close-badge">${tie ? '同点' : '揺れる軸'} · ${scores[0]}対${scores[1]}点</span>` : ''}</div>
          <div class="axis-labels">${axis.labels.map((label, pole) => `<span><span class="axis-pole"><span class="axis-symbol" aria-hidden="true">${symbols[index][pole]}</span>${axis.poles[pole]} · ${label}</span><strong>${personal ? `${pole ? 100 - percent : percent}%` : (pole === winner ? 'このタイプの向き' : '—')}</strong></span>`).join('')}</div>
          <div class="axis-track" role="img" aria-label="${personal ? `${axis.labels[0]} ${percent}%、${axis.labels[1]} ${100 - percent}%${close ? '。帯は揺れる軸の判定範囲、3分の1から3分の2。' : ''}` : `このタイプの方向：${axis.labels[winner]}`}" style="--value:${percent}%"><span class="axis-fill" style="width:${percent}%"></span><svg class="gauge-ticks" viewBox="0 0 100 28" preserveAspectRatio="none" aria-hidden="true"><path d="M0 18V28 M25 18V28 M50 0V28 M75 18V28 M100 18V28" fill="none" stroke="currentColor" stroke-width="1" vector-effect="non-scaling-stroke"/></svg>${close ? '<span class="range-band" aria-hidden="true"></span>' : ''}<span class="gauge-needle" aria-hidden="true"></span></div>
          ${personal ? `<div class="gauge-scale" aria-hidden="true"><span>0</span><span>25</span><span>50</span><span>75</span><span>100%</span></div><p class="gauge-caption">${axis.poles[0]}の得点割合${close ? '<br><span class="range-key" aria-hidden="true"></span>帯：揺れる軸の範囲（33〜67%）' : ''}</p>` : '<p class="gauge-caption">タイプの方向（回答割合ではありません）</p>'}
          <div class="axis-descriptions"><p class="axis-description">${axis.descriptions[0]}</p><p class="axis-description">${axis.descriptions[1]}</p></div>${close ? `<details class="notes"><summary>くわしく見る（軸の読み方）</summary><p class="axis-note">${note}</p><p class="axis-note">帯は、両極の得点がそれぞれ全体の3分の1以上になる判定範囲です。33〜67%は丸めた表示で、気持ちの変動を測った幅ではありません。</p></details>` : ''}</div>`;
      }).join('');
    }
    function detailHTML(code, personal) {
      const type = TYPES[code];
      const family = FAMILIES[code.slice(0, 2)];
      const friendCode = companionCode(code);
      const friend = TYPES[friendCode];
      const friendFamily = FAMILIES[friendCode.slice(0, 2)];
      const near = personal && result.closeAxes.length ? `<section class="section" style="--chapter:6"><h2>もうひとつ、近くの物語</h2><div class="nearby-links">${result.closeAxes.map(index => {
        const neighborCode = flipAxis(code, index);
        const neighbor = TYPES[neighborCode];
        return `<a class="nearby-link" href="#type/${neighborCode}"><small>${AXES[index].name}を反転</small>${neighbor.emoji} ${neighbor.name} <span class="code">${neighborCode}</span> ↗</a>`;
      }).join('')}</div><details class="notes"><summary>くわしく見る（近いタイプ）</summary><p class="section-note">点数が僅差だった「揺れる軸」。あと少し選び方が違えば、こんな隣のタイプにも。</p></details></section>` : '';
      return `<article style="--accent:${type.color};--hero-glow:${type.color}30">
        <p class="eyebrow result-heading">${personal ? 'あなたの物語のページ' : '登場人物図鑑 ／ タイプ詳細'}</p>
        <div class="result-card"><span class="frame-corners" aria-hidden="true"><i></i><i></i><i></i><i></i></span><div class="result-band"></div>
          <header class="result-hero"><span class="reveal-dust" aria-hidden="true"><i class="star" style="--x:8%;--y:12%"></i><i class="star" style="--x:21%;--y:3%"></i><i class="star" style="--x:34%;--y:26%"></i><i class="star" style="--x:47%;--y:7%"></i><i class="star" style="--x:61%;--y:19%"></i><i class="star" style="--x:75%;--y:4%"></i><i class="star" style="--x:90%;--y:24%"></i><i class="star" style="--x:15%;--y:42%"></i><i class="star" style="--x:55%;--y:38%"></i><i class="star" style="--x:84%;--y:46%"></i></span><p class="result-kicker">${personal ? '今日のあなたを童話にたとえると' : 'この物語の登場人物は'}</p><div class="portrait-frame"><img class="result-image illustration" src="images/${code}.png" alt="${type.name}" width="1024" height="1024" fetchpriority="high"><span class="portrait-stars" aria-hidden="true"><i class="star"></i><i class="star"></i></span></div><h1 class="illustration-caption" tabindex="-1">${type.name}</h1><p class="catch">${type.catch}</p></header>
          <section class="section persona" style="--chapter:0"><h2>${type.title}</h2><p>${type.persona}</p><h3 class="result-family">${personal ? 'あなたは' : ''}${family.name}の家系</h3>${familyMapHTML(code, personal, 4)}<p class="family-description">${family.description}</p><p class="result-motif"><span aria-hidden="true">${type.emoji}</span> ${type.motif}<span class="code">${code}</span></p></section>
          <section class="section" style="--chapter:1"><h2>${personal ? 'あなたの心の向き' : 'このタイプの心の向き'}</h2>${personal ? radarHTML(code) : ''}${axesHTML(code, personal)}<details class="notes"><summary>くわしく見る（心の向き）</summary><p class="section-note">${personal ? '各軸5問の回答の点数の割合です。性格の強さや能力の点数ではありません。' : 'タイプの方向を示しています。あなたの回答割合ではありません。'}</p>${personal && !result.closeAxes.length ? '<p class="section-note">今回は「揺れる軸」はありませんでした。</p>' : ''}</details></section>
          <section class="section" style="--chapter:2"><h2>この人の魅力</h2><ul class="trait-list">${type.strengths.map(text => `<li>${text}</li>`).join('')}</ul></section>
          <section class="section stumbles" style="--chapter:3"><h2>性格の裏側</h2><ul class="trait-list">${type.stumbles.map(text => `<li>${text}</li>`).join('')}</ul></section>
          <section class="section" style="--chapter:4"><h2>恋をすると</h2><p class="love-text">${type.love}</p><h3 class="love-pitfalls">恋の落とし穴</h3><ul class="trait-list">${type.lovePitfalls.map(text => `<li>${text}</li>`).join('')}</ul></section>
          <section class="section" style="--chapter:5"><h2>一緒にいると楽しい相手</h2><div class="companion-scene pair-diagram"><div class="companion-self"><img class="illustration" src="images/${code}.png" alt="" width="1024" height="1024" loading="lazy" decoding="async"><span class="illustration-caption">${type.name}</span><span class="code">${code}</span></div>${pairDiagramHTML(code, friendCode)}<div class="companion"><img class="companion-image illustration" src="images/${friendCode}.png" alt="${friend.name}" width="1024" height="1024" loading="lazy" decoding="async"><div><small class="companion-family">${friendFamily.name}の家系</small><span class="code">${friendCode}</span><h3 class="illustration-caption">${friend.name}</h3></div></div></div><p class="pair-line">${pairLine(code)}</p><p class="pair-love"><strong>恋愛だと</strong>${type.pairLove}</p><details class="notes companion-notes"><summary>くわしく見る（相性の見方）</summary><p class="section-note">動き出すきっかけと考え始めるところは違い、選ぶ基準と進め方は同じ。楽しみ方のたとえです。</p></details><a class="button" href="#type/${friendCode}">相手のページを開く <span aria-hidden="true">↗</span></a></section>
          ${near}
          <details class="section provenance" style="--chapter:${near ? 7 : 6}"><summary>くわしく見る（出典・根拠）</summary><h2>なぜ、このキャラ？</h2><p class="section-note">物語のこんな場面を、4つの選び方に重ねました。</p><dl class="evidence">${type.evidence.map((phrase, index) => `<div class="evidence-row"><dt>${code[index]}</dt><dd><strong>${AXES[index].labels[AXES[index].poles.indexOf(code[index])]}</strong>${phrase}</dd></div>`).join('')}</dl><p class="source-note">${type.source}<br>場面の読み方は、この診断のための解釈です。</p></details>
        </div>
        <div class="actions"><button class="button primary" data-action="copy" data-code="${code}">${personal ? '結果をコピーする' : 'このタイプをコピーする'} <span aria-hidden="true">↗</span></button><p id="copy-status" class="status" role="status" aria-live="polite"></p><div class="copy-fallback" id="copy-fallback" hidden><label for="copy-text">下の文を選択してコピーしてください。</label><textarea id="copy-text" readonly></textarea></div>
        ${!personal && result ? '<a class="button" href="#result">自分の診断結果に戻る</a>' : ''}
        <button class="button" data-action="start">${personal || result ? 'もう一度、診断する' : '自分のタイプを診断する'}</button><a class="button" href="#types">16タイプの一覧へ</a></div>
        <div class="center"><a class="text-link" href="#home">表紙に戻る</a></div>
      </article>`;
    }
    function render() {
      clearTimeout(answerTimer);
      locked = false;
      let route = location.hash || '#home';
      if ((route === '#quiz' && !quiz.length) || (route === '#result' && !result)) {
        history.replaceState(null, '', '#home');
        route = '#home';
      }
      let html;
      let title = '童話キャラ16タイプ診断';
      if (route === '#quiz') {
        html = questionHTML();
        title = `${page + 1}ページ目 | ${title}`;
      } else if (route === '#types') {
        html = typesHTML();
        title = `16タイプの図鑑 | ${title}`;
      } else if (route === '#result') {
        html = detailHTML(result.code, true);
        title = `${TYPES[result.code].name} | ${title}`;
      } else {
        const match = route.match(/^#type\/([QC][RW][SH][PF])$/);
        if (match && Object.hasOwn(TYPES, match[1])) {
          html = detailHTML(match[1], false);
          title = `${TYPES[match[1]].name} | ${title}`;
        } else html = homeHTML();
      }
      document.title = title;
      app.innerHTML = html;
      app.classList.remove('screen-enter', 'reveal-complete');
      void app.offsetWidth;
      app.classList.add('screen-enter');
      window.scrollTo({ top: 0, behavior: 'instant' });
      app.querySelector('h1')?.focus({ preventScroll: true });
    }
    function answer(pole, button) {
      if (locked || location.hash !== '#quiz' || !quiz[page].options.some(option => option.pole === pole)) return;
      locked = true;
      app.querySelectorAll('[data-answer]').forEach(choice => {
        choice.disabled = true;
        choice.classList.toggle('selected', choice === button);
        choice.setAttribute('aria-pressed', String(choice === button));
      });
      answers[page] = pole;
      selectedOptions[page] = Number(button.dataset.option);
      // 戻って変更した場合も後続の回答を保持し、最終ページで全回答から再集計する。
      answerTimer = setTimeout(() => {
        if (page === quiz.length - 1) {
          result = calculateResult(quiz, selectedOptions);
          navigate('#result');
        } else {
          page++;
          render();
        }
      }, 520);
    }
    async function copyResult(code, button) {
      const text = `私は${TYPES[code].name}（${code}）でした！`;
      const status = document.getElementById('copy-status');
      const fallback = document.getElementById('copy-fallback');
      const field = document.getElementById('copy-text');
      button.disabled = true;
      let copied = false;
      try {
        if (navigator.clipboard?.writeText) {
          await navigator.clipboard.writeText(text);
          copied = true;
        }
      } catch (_) { /* file://や権限のない環境では下のコピー手段を使う。 */ }
      if (!status.isConnected) return;
      if (!copied) {
        fallback.hidden = false;
        field.value = text;
        field.focus();
        field.select();
        field.setSelectionRange(0, text.length);
        try { copied = document.execCommand('copy'); } catch (_) { copied = false; }
      }
      if (copied) {
        fallback.hidden = true;
        status.textContent = 'コピーしました。好きなところに貼り付けて使えます。';
        button.focus();
      } else {
        status.textContent = '自動コピーが使えないため、下の文を選択しました。';
      }
      button.disabled = false;
    }
    app.addEventListener('click', event => {
      // Presentation only: a tap completes the reveal without intercepting any action.
      app.classList.add('reveal-complete');
      const answerButton = event.target.closest('[data-answer]');
      if (answerButton) { answer(answerButton.dataset.answer, answerButton); return; }
      const button = event.target.closest('[data-action]');
      if (!button) return;
      switch (button.dataset.action) {
        case 'start': startQuiz(); break;
        case 'resume': navigate('#quiz'); break;
        case 'back':
          clearTimeout(answerTimer);
          locked = false;
          if (page > 0) { page--; render(); }
          else navigate('#home');
          break;
        case 'copy': copyResult(button.dataset.code, button); break;
      }
    });
    window.addEventListener('hashchange', render);
    render();
  </script>
  <script>
    // Preview-only shim: <base href="../"> makes hash links resolve to the parent (production).
    // Keep in-page hash navigation inside this preview document. Diagnosis logic is untouched.
    document.addEventListener('click', function (e) {
      var a = e.target.closest('a[href^="#"]');
      if (!a) return;
      e.preventDefault();
      var h = a.getAttribute('href');
      if (location.hash !== h) { location.hash = h; }
      else { window.dispatchEvent(new HashChangeEvent('hashchange')); }
    }, true);
  </script>
</body>
</html>
